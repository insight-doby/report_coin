name: track
on:
  schedule:
    - cron: "20 * * * *"   # 매시간: 장부 채점만 (AI 호출 없음)
  workflow_dispatch:
concurrency: { group: bot-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy cryptography
      - name: Track
        env:
          LOCAL_DATA_DIR: data
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BITHUMB_ACCESS_KEY: ${{ secrets.BITHUMB_ACCESS_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
        run: python -u bot.py track
      - name: Commit data
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data && (git diff --cached --quiet || git commit -m "track $(date -u +%FT%TZ)")
          # 저장 충돌 대비: 최대 4번 재시도. 같은 줄을 서로 고쳤으면 원격(최신) 내용을 우선
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase origin ${{ github.ref_name }}; then
              git push && { ok=1; break; }
            else
              git rebase --abort 2>/dev/null || true
              git pull --rebase -X ours origin ${{ github.ref_name }} && git push && { ok=1; break; }
            fi
            sleep $((i*7))
          done
          [ "$ok" = 1 ] || { echo '저장 4번 실패'; exit 1; }
