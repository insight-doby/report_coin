name: track
on:
  schedule:
    - cron: "20 * * * *"   # 매시간: 장부 채점만 (AI 호출 없음)
  workflow_dispatch:
concurrency: { group: bot-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy
      - name: Track
        env:
          LOCAL_DATA_DIR: data
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u bot.py track
      - name: Commit data
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "track $(date -u +%FT%TZ)")
          git pull --rebase origin ${{ github.ref_name }} && git push
