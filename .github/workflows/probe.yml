name: probe
on:
  workflow_dispatch:
    inputs:
      script: { description: "tools/ 안의 스크립트", required: false, default: "probe.py" }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python -u tools/${{ inputs.script || 'probe.py' }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "probe")
          git pull --rebase origin ${{ github.ref_name }} && git push
