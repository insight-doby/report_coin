name: probe
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python -u tools/probe.py
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/probe.json && (git diff --cached --quiet || git commit -m "probe")
          git pull --rebase origin ${{ github.ref_name }} && git push
