name: probe
on:
  workflow_dispatch:
    inputs:
      script: { description: "tools/ 안의 스크립트", required: false, default: "probe.py" }
concurrency: { group: bot-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python -u tools/${{ inputs.script || 'probe.py' }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "probe")
          # 저장 충돌 대비: 최대 4번 재시도. 같은 줄을 서로 고쳤으면 원격(최신) 내용을 우선
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase origin ${{ github.ref_name }}; then
              git push && { ok=1; break; }
            else
              git rebase --abort 2>/dev/null || true
              git pull --rebase -X ours origin ${{ github.ref_name }} && git push && { ok=1; break; }
            fi
            sleep $((i*7))
          done
          [ "$ok" = 1 ] || { echo '저장 4번 실패'; exit 1; }
