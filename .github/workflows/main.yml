name: 봇 실행
on:
  workflow_dispatch:
    inputs:
      watchlist:
        description: '관심종목 (쉼표 구분, 예: BTC,ETH,WLD) — 비우면 저장소 변수 WATCHLIST 사용'
        required: false
        default: ''
  schedule:
    - cron: '5 23 * * *'   # 08:05 KST
    - cron: '5 3 * * *'    # 12:05 KST
    - cron: '5 9 * * *'    # 18:05 KST
concurrency: { group: bot-data, cancel-in-progress: false }
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치
        run: pip install requests numpy
      - name: 스캔
        env:
          LOCAL_DATA_DIR:   data
          SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST:        ${{ github.event.inputs.watchlist || vars.WATCHLIST }}
        run: python -u bot.py scan
      - name: 데이터 커밋
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "스캔 $(date -u +%FT%TZ)")
          git pull --rebase origin ${{ github.ref_name }} && git push
