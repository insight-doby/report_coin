name: snapshot
on:
  workflow_dispatch:
concurrency: { group: bot-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy
      - name: Snapshot
        env: { LOCAL_DATA_DIR: data }
        run: python -u bot.py snapshot
      - name: Commit data
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)")
          git pull --rebase origin ${{ github.ref_name }} && git push
