name: portfolio
on:
  # 계좌 요약은 개인 서버(server/coinbot.py)가 맡습니다 — 빗썸 키가 고정 IP만 허용하기 때문
  workflow_dispatch:
concurrency: { group: bot-data, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests numpy cryptography
      - name: 계좌 요약 (금액은 텔레그램으로만, 로그에는 남기지 않음)
        env:
          LOCAL_DATA_DIR: data
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BITHUMB_ACCESS_KEY: ${{ secrets.BITHUMB_ACCESS_KEY }}
          BITHUMB_SECRET_KEY: ${{ secrets.BITHUMB_SECRET_KEY }}
        run: python -u bot.py portfolio
      - name: Commit data
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A data && (git diff --cached --quiet || git commit -m "portfolio sync")
          # 저장 충돌 대비: 최대 4번 재시도. 같은 줄을 서로 고쳤으면 원격(최신) 내용을 우선
          ok=0
          for i in 1 2 3 4; do
            if git pull --rebase origin ${{ github.ref_name }}; then
              git push && { ok=1; break; }
            else
              git rebase --abort 2>/dev/null || true
              git pull --rebase -X ours origin ${{ github.ref_name }} && git push && { ok=1; break; }
            fi
            sleep $((i*7))
          done
          [ "$ok" = 1 ] || { echo '저장 4번 실패'; exit 1; }
