<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코주부 시그널</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--sub:#6b7280;--line:#e5e7eb;--go:#16a34a;--sel:#d97706;--stop:#dc2626;--accent:#2563eb;--soft:#f1f5f9;--up:#dc2626;--down:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--sub:#9aa3b2;--line:#2a2f3a;--soft:#232834;--accent:#60a5fa;--go:#4ade80;--sel:#fbbf24;--stop:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--sub:#9aa3b2;--line:#2a2f3a;--soft:#232834;--accent:#60a5fa;--go:#4ade80;--sel:#fbbf24;--stop:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
h1{font-size:18px;margin:0}
.meta{color:var(--sub);font-size:12px}
button{font:inherit;cursor:pointer}
.ib{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 10px}
nav{display:flex;gap:6px;margin:8px 0 14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
nav button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font-weight:600}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.light{display:flex;align-items:center;gap:12px}
.dot{width:44px;height:44px;border-radius:50%;flex:none}
.dot.GO{background:var(--go)}.dot.SELECTIVE{background:var(--sel)}.dot.STOP{background:var(--stop)}.dot.UNKNOWN{background:var(--sub)}
.light h2{margin:0;font-size:18px}
.light p{margin:2px 0 0;color:var(--sub);font-size:13px}
ul.checks{list-style:none;padding:0;margin:10px 0 0;font-size:13px;color:var(--sub)}
ul.checks li{padding:2px 0}
.pick-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk{font-size:18px;font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--sub);margin-left:6px}
.tag.now{background:var(--go);color:#fff}.tag.wait{background:var(--sel);color:#fff}.tag.warn{background:var(--stop);color:#fff}
.price{font-size:20px;font-weight:700}
.sub{color:var(--sub);font-size:13px}
.ladder{position:relative;height:46px;margin:34px 6px 22px;background:linear-gradient(90deg,rgba(220,38,38,.16) 0 var(--sl),rgba(22,163,74,.16) var(--sl) 100%);border-radius:6px}
.ladder .m{position:absolute;top:0;bottom:0;width:2px;background:var(--sub)}
.ladder .m span{position:absolute;white-space:nowrap;font-size:11px;transform:translateX(-50%);color:var(--sub)}
.ladder .m.top span{top:-17px}.ladder .m.bot span{bottom:-17px}
.ladder .m.cur{background:var(--accent);width:3px}.ladder .m.cur span{color:var(--accent);font-weight:700}
.ladder .zone{position:absolute;top:10px;bottom:10px;background:rgba(37,99,235,.25);border:1px dashed var(--accent);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.grid div{background:var(--soft);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--sub)}
.grid b{display:block;color:var(--text);font-size:13px}
.reasons{margin:10px 0 0;padding-left:18px;font-size:13px}
.risk{color:var(--stop)}
.status{margin-top:8px;font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:26px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
input,select{font:inherit;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.form{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px}
@media(max-width:560px){.form{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
.pos{color:var(--up)}.neg{color:var(--down)}
.big{font-size:22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stats div{background:var(--soft);border-radius:10px;padding:10px}
.stats span{font-size:12px;color:var(--sub);display:block}
.warn-box{background:rgba(217,119,6,.12);border:1px solid var(--sel);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
svg{width:100%;height:120px;display:block}
.err{color:var(--stop)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>코주부 시그널 <span class="sub">2~5일 스윙</span></h1><div class="meta" id="meta">불러오는 중…</div></div>
  <div><button class="ib" id="refresh">새로고침</button> <button class="ib" id="theme">🌓</button></div>
</header>
<nav id="tabs">
  <button data-t="today" class="on">오늘 할 일</button>
  <button data-t="pos">내 포지션</button>
  <button data-t="watch">감시</button>
  <button data-t="verify">검증</button>
</nav>
<main id="view"></main>
</div>

<script>
"use strict";
const RAW = "https://raw.githubusercontent.com/insight-doby/report_coin/main/data/";
const SETUP = {pullback:"눌림목", breakout_retest:"돌파 후 안착", squeeze:"수렴 돌파 대기"};
const S = {tab:"today", latest:null, ledger:[], stats:null, live:{}, liveAt:null, err:""};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function won(v){ if(v==null||isNaN(v)) return "-"; v=+v; if(v>=1000) return Math.round(v).toLocaleString()+"원"; const d=v>=100?1:v>=1?2:v>=0.01?4:8; return parseFloat(v.toFixed(d))+"원"; }
function pct(v,sign=true){ if(v==null||isNaN(v)) return "-"; return (sign&&v>0?"+":"")+(+v).toFixed(1)+"%"; }
function ls(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

async function getJSON(name){
  for(const base of ["./data/", RAW]){
    try{ const r = await fetch(base+name+"?t="+Date.now(), {cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  }
  return null;
}
async function load(){
  S.err="";
  const [l, g, st] = await Promise.all([getJSON("latest.json"), getJSON("ledger.json"), getJSON("stats.json")]);
  if(!l) S.err = "추천 데이터를 불러오지 못했습니다. 봇이 아직 한 번도 실행되지 않았을 수 있습니다.";
  S.latest=l; S.ledger=Array.isArray(g)?g:[]; S.stats=st;
  await loadLive();
  render();
}
async function loadLive(){
  try{
    const r = await fetch("https://api.bithumb.com/public/ticker/ALL_KRW", {cache:"no-store"});
    const j = await r.json();
    if(j.status==="0000"){
      const m={};
      for(const [k,v] of Object.entries(j.data)){ if(v&&v.closing_price){ m[k.toUpperCase()]=parseFloat(v.closing_price); } }
      S.live=m; S.liveAt=new Date();
    }
  }catch(e){ /* 실패하면 봇 스냅샷 가격 사용 */ }
}
const priceOf = (tk, fallback) => S.live[tk] ?? fallback;

function metaLine(){
  const l=S.latest; if(!l) return S.err?"데이터 없음":"";
  const gen=new Date(l.generated_at); const age=Math.round((Date.now()-gen)/60000);
  const stale = age>360 ? ` <span class="err">· ${Math.round(age/60)}시간 전 분석 — 오래됨</span>` : "";
  const live = S.liveAt ? ` · 현재가 ${S.liveAt.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}` : " · 실시간 가격 실패(스냅샷 사용)";
  return `분석 ${gen.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}${live}${stale}`;
}

/* ---------- 오늘 할 일 ---------- */
function ladder(p, cur){
  const pts=[p.stop,p.zone_lo,p.zone_hi,p.t1,p.t2,cur].filter(x=>x>0);
  const lo=Math.min(...pts), hi=Math.max(...pts), span=(hi-lo)||1, pad=span*0.06;
  const L=lo-pad, H=hi+pad, pos=x=>((x-L)/(H-L)*100).toFixed(2);
  const sl=pos(p.entry);
  const mk=(x,label,cls)=>`<div class="m ${cls}" style="left:${pos(x)}%"><span>${label}</span></div>`;
  return `<div class="ladder" style="--sl:${sl}%">
    <div class="zone" style="left:${pos(p.zone_lo)}%;width:${(pos(p.zone_hi)-pos(p.zone_lo)).toFixed(2)}%"></div>
    ${mk(p.stop,"손절","bot")}${mk(p.t1,"1차","bot")}${mk(p.t2,"2차","bot")}${mk(cur,"현재","top cur")}</div>`;
}
function statusOf(p, cur){
  if(cur<=p.stop) return {t:"⛔ 손절선 아래 — 이 추천은 무효입니다. 진입 금지", c:"neg"};
  if(cur>=p.t1) return {t:"🚫 이미 1차 목표 근처까지 올랐습니다. 추격 금지", c:"neg"};
  if(cur>p.zone_hi*1.03) return {t:`⏳ 매수구간보다 ${pct((cur/p.zone_hi-1)*100,false)} 위 — ${won(p.zone_hi)} 이하로 내려오면 매수`, c:""};
  if(cur>p.zone_hi) return {t:`⏳ 구간 바로 위입니다. ${won(p.zone_hi)} 이하에서 매수`, c:""};
  if(cur>=p.zone_lo) return {t:"✅ 지금 매수 구간입니다", c:"pos"};
  return {t:`⚠️ 구간 아래로 내려왔습니다. 손절선(${won(p.stop)})까지 ${pct((cur/p.stop-1)*100,false)} — 반등 확인 후`, c:"neg"};
}
function pickCard(p){
  const cur=priceOf(p.ticker,p.price), st=statusOf(p,cur);
  const ai=p.ai||{};
  const aiTag = ai.status==="caution"?`<span class="tag warn">악재 주의</span>`: ai.status==="ok"?`<span class="tag">악재 없음</span>`:`<span class="tag">악재 미확인</span>`;
  const mult = S.latest.market.size_mult;
  return `<div class="card">
    <div class="pick-h"><div><span class="tk">${esc(p.ticker)}</span><span class="tag ${p.state}">${p.state==="now"?"지금":"지정가 대기"}</span><span class="tag">${esc(p.setup_label)}</span>${aiTag}</div>
      <div class="price">${won(cur)} <span class="sub ${p.chg24>=0?"pos":"neg"}">${pct(p.chg24)}</span></div></div>
    ${ladder(p,cur)}
    <div class="status ${st.c}">${st.t}</div>
    <div class="grid">
      <div>매수 구간<b>${won(p.zone_lo)}~${won(p.zone_hi)}</b></div>
      <div>손절<b class="neg">${won(p.stop)} (-${p.stop_pct}%)</b></div>
      <div>1차 (절반 매도)<b class="pos">${won(p.t1)} (+${p.t1_pct}%)</b></div>
      <div>2차<b class="pos">${won(p.t2)} (+${p.t2_pct}%)</b></div>
    </div>
    <ul class="reasons">${(p.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join("")}${(p.risks||[]).map(r=>`<li class="risk">${esc(r)}</li>`).join("")}</ul>
    ${ai.positive?`<div class="sub" style="margin-top:6px">💡 AI가 찾은 호재: ${esc(ai.positive)}</div>`:""}
    ${ai.checked_at?`<div class="sub">AI 악재 확인: ${esc(ai.checked_at.slice(5,16).replace("T"," "))}</div>`:""}
    <div class="sub" style="margin-top:8px">권장 비중 ×${mult} · 1차 도달 시 절반 매도 후 손절을 본전으로 · 5일 지나면 정리${p.state==="wait"?` · 미체결 시 ${p.valid_hours}시간 후 취소`:""}</div>
  </div>`;
}
function viewToday(){
  const l=S.latest; if(!l) return `<div class="card empty err">${esc(S.err)}</div>`;
  const m=l.market;
  let h=`<div class="card"><div class="light"><div class="dot ${m.gate}"></div><div><h2>${esc(m.label)}</h2><p>${esc(m.headline)}</p></div></div>
    <ul class="checks">${(m.checks||[]).map(c=>`<li>${c.ok?"✅":"⚠️"} ${esc(c.text)}</li>`).join("")}</ul></div>`;
  if(l.ai_status==="unavailable") h+=`<div class="warn-box">AI 악재 검증이 이번에 작동하지 않았습니다. 매수 전에 공지·뉴스를 직접 확인하세요.</div>`;
  if(l.picks.length){ h+=`<h3 style="margin:16px 2px 8px">지금 볼 종목 ${l.picks.length}개</h3>`+l.picks.map(pickCard).join(""); }
  else h+=`<div class="card empty">${m.gate==="STOP"?"시장이 위험해 오늘은 신규 매수를 쉽니다.":"조건을 충족한 종목이 없습니다."}<br>억지로 사지 않는 것도 전략입니다. '감시' 탭에서 곧 열릴 후보를 확인하세요.</div>`;
  if(l.excluded&&l.excluded.length){
    h+=`<h3 style="margin:16px 2px 4px">조건은 맞았지만 제외한 종목</h3><div class="sub" style="margin:0 2px 8px">차트 조건은 통과했지만 아래 이유로 추천에서 뺐습니다. 사유를 읽고 직접 판단하세요.</div>`;
    h+=l.excluded.map(x=>{ const cur=priceOf(x.ticker,x.price), pl=x.plan;
      return `<div class="card"><div class="pick-h"><div><span class="tk">${esc(x.ticker)}</span><span class="tag warn">${esc(x.kind||"제외")}</span>${x.setup_label?`<span class="tag">${esc(x.setup_label)}</span>`:""}</div><div class="price">${won(cur)}</div></div>
        <div class="status" style="color:var(--stop)">${esc(x.reason)}</div>
        <div style="margin-top:6px;font-size:14px;line-height:1.6">${esc(x.note||"")}</div>
        ${x.checked_at?`<div class="sub" style="margin-top:4px">AI 확인: ${esc(x.checked_at.slice(5,16).replace("T"," "))} · 출처는 AI 검색 요약이므로 원문을 한 번 더 확인하세요</div>`:""}
        ${pl?`<div class="grid"><div>매수 구간<b>${won(pl.zone_lo)}~${won(pl.zone_hi)}</b></div><div>손절<b class="neg">${won(pl.stop)} (-${pl.stop_pct}%)</b></div><div>1차<b class="pos">${won(pl.t1)} (+${pl.t1_pct}%)</b></div><div>2차<b class="pos">${won(pl.t2)}</b></div></div>`:""}
        ${(x.reasons||[]).length?`<ul class="reasons">${x.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}</div>`;}).join("");
  }
  if(l.ai_calls_today!=null) h+=`<div class="sub" style="text-align:center;margin-top:8px">AI 악재 검증 호출: 이번 ${l.ai_calls||0}회 · 오늘 ${l.ai_calls_today}회 (같은 종목은 24시간 재사용)</div>`;
  return h;
}

/* ---------- 내 포지션 ---------- */
function viewPos(){
  const pos=ls("positions",[]);
  const planFor = tk => S.ledger.filter(e=>e.ticker===tk&&(e.status==="open"||e.status==="pending")).pop();
  let rows="";
  pos.forEach((p,i)=>{
    const cur=priceOf(p.ticker,null), pl=cur?(cur/p.buy-1)*100:null, plan=planFor(p.ticker);
    let advice="-";
    if(cur){
      const stop=p.stop||plan?.stop, t1=p.t1||plan?.t1;
      if(stop&&cur<=stop) advice=`<b class="neg">손절선 도달 — 정리</b>`;
      else if(t1&&cur>=t1) advice=`<b class="pos">1차 목표 — 절반 매도</b>`;
      else if(stop) advice=`손절 ${won(stop)}${t1?` / 1차 ${won(t1)}`:""}`;
    }
    rows+=`<tr><td><b>${esc(p.ticker)}</b></td><td>${won(p.buy)}</td><td>${cur?won(cur):"-"}</td><td class="${pl>=0?"pos":"neg"}">${pl==null?"-":pct(pl)}</td><td>${advice}</td><td><button class="ib" data-del="${i}">삭제</button></td></tr>`;
  });
  return `<div class="card"><b>포지션 추가</b>
    <div class="form" style="margin-top:8px">
      <input id="pt" placeholder="티커 (예: SUI)"><input id="pb" type="number" step="any" placeholder="매수가(원)">
      <input id="ps" type="number" step="any" placeholder="손절가(선택)"><input id="p1" type="number" step="any" placeholder="1차목표(선택)">
      <button class="ib" id="padd">추가</button></div>
    <div class="sub" style="margin-top:6px">입력은 이 브라우저에만 저장됩니다. 손절·목표를 비워두면 봇 추천 계획이 있을 때 그 값을 씁니다.</div></div>
  <div class="card">${pos.length?`<table><tr><th>종목</th><th>매수가</th><th>현재가</th><th>손익</th><th>대응</th><th></th></tr>${rows}</table>`:`<div class="empty">등록된 포지션이 없습니다.</div>`}</div>`;
}

/* ---------- 감시 ---------- */
function viewWatch(){
  const l=S.latest; if(!l) return `<div class="card empty err">${esc(S.err)}</div>`;
  let h="";
  if(l.watch.length){
    h+=`<div class="card"><b>곧 매수 신호가 열릴 후보</b><table style="margin-top:8px"><tr><th>종목</th><th>유형</th><th>현재가</th><th>조건</th></tr>`+
      l.watch.map(w=>{ const cur=priceOf(w.ticker,w.price), d=w.trigger_price?(cur/w.trigger_price-1)*100:null;
        return `<tr><td><b>${esc(w.ticker)}</b></td><td>${esc(w.setup_label)}</td><td>${won(cur)}<br><span class="sub">기준가 ${pct(d)}</span></td><td style="text-align:left;font-size:12px">${esc(w.trigger_text||"")}${w.note?`<br><span class="sub">${esc(w.note)}</span>`:""}</td></tr>`;}).join("")+`</table></div>`;
  } else h+=`<div class="card empty">감시 중인 후보가 없습니다.</div>`;
  if(l.pumps&&l.pumps.length){
    h+=`<div class="card"><b>최근 7일 급등 종목 — 고점 대비 위치</b><div class="sub">매수 신호가 아닙니다. 급등 후 눌림 전략은 '검증' 결과가 나오기 전까지 관찰만 하세요.</div><table style="margin-top:8px"><tr><th>종목</th><th>급등폭</th><th>고점 대비</th><th>-20% / -25% / -30%</th></tr>`+
      l.pumps.map(p=>{ const cur=priceOf(p.ticker,p.price), fp=(cur/p.peak-1)*100;
        return `<tr><td><b>${esc(p.ticker)}</b><br><span class="sub">고점 ${p.days_since_peak}일 전</span></td><td class="pos">+${p.pump_pct}%</td><td class="neg">${pct(fp)}${cur<p.base?`<br><span class="sub">급등 전 가격 아래</span>`:""}</td><td style="font-size:12px">${won(p.levels["20"])}<br>${won(p.levels["25"])}<br>${won(p.levels["30"])}</td></tr>`;}).join("")+`</table></div>`;
  }
  if(l.watchlist&&l.watchlist.length){
    h+=`<div class="card"><b>내 관심종목</b><table style="margin-top:8px"><tr><th>종목</th><th>현재가</th><th>추세</th><th>RSI</th><th>메모</th></tr>`+
      l.watchlist.map(w=>`<tr><td><b>${esc(w.ticker)}</b></td><td>${won(priceOf(w.ticker,w.price))}</td><td>${esc(w.trend)}</td><td>${w.rsi_d??"-"}</td><td style="text-align:left;font-size:12px">${esc([w.flag,w.note].filter(Boolean).join(" · "))}</td></tr>`).join("")+`</table></div>`;
  }
  return h;
}

/* ---------- 검증 ---------- */
function curveSvg(c){
  if(!c||c.length<2) return "";
  const ys=c.map(p=>p.r), mn=Math.min(0,...ys), mx=Math.max(0,...ys), sp=(mx-mn)||1;
  const pts=c.map((p,i)=>`${(i/(c.length-1)*300).toFixed(1)},${(110-(p.r-mn)/sp*100).toFixed(1)}`).join(" ");
  const z=(110-(0-mn)/sp*100).toFixed(1);
  return `<svg viewBox="0 0 300 120" preserveAspectRatio="none"><line x1="0" x2="300" y1="${z}" y2="${z}" stroke="var(--line)"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts}"/></svg>`;
}
function viewVerify(){
  const s=S.stats; if(!s) return `<div class="card empty">아직 검증 데이터가 없습니다. 추천이 쌓이면 여기에 표시됩니다.</div>`;
  const o=s.overall, f=(v,sfx="")=>v==null?"-":v+sfx;
  let h=`<div class="card"><b>전체 성적 (수수료 ${s.fee_pct_per_side}%×2 반영, 단위 R = 손절폭 1배)</b>
    ${o.reliable?"":`<div class="warn-box" style="margin-top:8px">종료된 거래가 ${o.n_closed}건뿐입니다. 20건 이상 쌓이기 전에는 우연일 수 있으니 참고만 하세요.</div>`}
    <div class="stats" style="margin-top:8px">
      <div><span>추천 수</span><div class="big">${o.n_signals}</div></div>
      <div><span>체결률</span><div class="big">${f(o.fill_rate,"%")}</div></div>
      <div><span>종료 거래</span><div class="big">${o.n_closed}</div></div>
      <div><span>승률</span><div class="big">${f(o.win_rate,"%")}</div></div>
      <div><span>평균 손익</span><div class="big ${o.avg_r>=0?"pos":"neg"}">${o.avg_r==null?"-":(o.avg_r>0?"+":"")+o.avg_r+"R"}</div></div>
      <div><span>손익비(PF)</span><div class="big">${f(o.profit_factor)}</div></div>
    </div>
    <div class="sub" style="margin-top:8px">진행 중 ${o.n_open} · 대기 ${o.n_pending} · 미체결 만료 ${o.n_unfilled}. 같은 캔들에서 손절·목표가 겹치면 손절로 계산합니다.</div></div>`;
  if(s.curve&&s.curve.length>1) h+=`<div class="card"><b>누적 손익 (R)</b>${curveSvg(s.curve)}</div>`;
  const rowsOf=(obj,label)=>Object.keys(obj||{}).length?`<div class="card"><b>${label}</b><table style="margin-top:8px"><tr><th></th><th>종료</th><th>승률</th><th>평균R</th><th>PF</th></tr>`+
    Object.entries(obj).map(([k,v])=>`<tr><td>${esc(SETUP[k]||k)}</td><td>${v.n_closed}</td><td>${f(v.win_rate,"%")}</td><td>${v.avg_r==null?"-":v.avg_r}</td><td>${f(v.profit_factor)}</td></tr>`).join("")+`</table></div>`:"";
  h+=rowsOf(s.by_setup,"유형별")+rowsOf(s.by_gate,"추천 당시 시장 신호등별");
  const recent=[...S.ledger].sort((a,b)=>b.issued_ts-a.issued_ts).slice(0,20);
  if(recent.length){
    const stl={pending:"대기",open:"진행",closed:"종료",expired:"만료"};
    h+=`<div class="card"><b>최근 추천 20건</b><table style="margin-top:8px"><tr><th>종목</th><th>유형</th><th>상태</th><th>결과</th></tr>`+
      recent.map(e=>`<tr><td><b>${esc(e.ticker)}</b><br><span class="sub">${esc((e.issued_at||"").slice(5,16).replace("T"," "))}</span></td><td>${esc(SETUP[e.setup]||e.setup)}</td><td>${stl[e.status]||e.status}${e.t1_hit&&e.status==="open"?" (1차↑)":""}</td>
      <td class="${e.r_net>0?"pos":e.r_net<0?"neg":""}">${e.r_net!=null?(e.r_net>0?"+":"")+e.r_net+"R":e.status==="open"?`MFE ${e.mfe_r}R`:"-"}</td></tr>`).join("")+`</table></div>`;
  }
  return h;
}

function render(){
  $("#meta").innerHTML=metaLine();
  const v={today:viewToday,pos:viewPos,watch:viewWatch,verify:viewVerify}[S.tab];
  $("#view").innerHTML=v();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  const add=$("#padd");
  if(add) add.onclick=()=>{
    const ticker=$("#pt").value.trim().toUpperCase(), buy=parseFloat($("#pb").value);
    if(!ticker||!(buy>0)) return;
    const stop=parseFloat($("#ps").value)||null, t1=parseFloat($("#p1").value)||null;
    const pos=ls("positions",[]); pos.push({ticker,buy,stop,t1}); lsSet("positions",pos); render();
  };
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const pos=ls("positions",[]); pos.splice(+b.dataset.del,1); lsSet("positions",pos); render(); });
}
$("#tabs").onclick=e=>{ const t=e.target.dataset?.t; if(t){ S.tab=t; render(); } };
$("#refresh").onclick=()=>{ $("#meta").textContent="새로고침 중…"; load(); };
$("#theme").onclick=()=>{ const r=document.documentElement, cur=r.dataset.theme|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"); const n=cur==="dark"?"light":"dark"; r.dataset.theme=n; lsSet("theme",n); };
{ const t=ls("theme",null); if(t) document.documentElement.dataset.theme=t; }
setInterval(async()=>{ await loadLive(); render(); }, 60000);
load();
</script>
